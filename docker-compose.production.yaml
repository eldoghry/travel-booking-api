services:
  node-app:
    image: ghcr.io/randa-magdy/travel-booking-api:latest
    expose: # api not public & each traffic goes through nginx
      - "4000"
    env_file:
      - ./env/production.env
    environment:
      - NODE_ENV=production
    restart: always
    
  nginx-srv:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - node-app
    networks:
      - app_network

  redis-srv:
    restart: always

  postgres-srv:
    restart: always

  rabbitmq-srv:
    restart: always

  elasticsearch:
    restart: unless-stopped

  kibana:
    restart: unless-stopped

  filebeat:
    restart: unless-stopped