user  nginx;
worker_processes  auto; 
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# tuning
worker_rlimit_nofile 200000;

events {
    worker_connections  4096;
    multi_accept on; 
}

# configuration specific to HTTP & affecting all virtual servers
http {
    ## Basic settings
    sendfile on; 
    tcp_nopush on; 
    tcp_nodelay on;
    keepalive_timeout 65; 
    types_hash_max_size 4096; 
    server_tokens off;
    server_names_hash_bucket_size 64;

    # MIME
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format - JSON for ELK
    log_format json_combined escape=json
    '{'
      '"time_local":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for",'
      '"request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 4;

    # Proxy settings
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;

    # Buffer tuning
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 1024m;


    # Upstream keepalive connections (connection reuse)
    upstream api_upstream {
        least_conn; # least connections algorithm
        server node-app:4000 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=30r/s; 
    limit_req_zone $binary_remote_addr zone=slow_zone:10m rate=5r/s;

    # Connection limit 
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Proxy cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:100m inactive=10m max_size=1g;
    proxy_cache_key "$scheme$host$request_uri";

    # Include site configs
    include /etc/nginx/conf.d/*.conf;
}
