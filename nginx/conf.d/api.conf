server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    
    # SSL Configuration
    ssl_certificate     /etc/nginx/certs/travelbooking.crt;
    ssl_certificate_key /etc/nginx/certs/travelbooking.key;


    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'";

    # API reverse proxy
    location /api/ {
        proxy_pass http://api_upstream$request_uri;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        # Rate limiting
        limit_req zone=req_zone burst=10 delay=5;
        limit_req_status 429;

        limit_conn addr 5;
        limit_conn_status 429;


        # Proxy caching (GET requests only)
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;

        # Proxy next upstream 
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;

    }
}

