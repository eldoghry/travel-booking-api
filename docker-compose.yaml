services:
  node-app:
    container_name: travel-booking-api
    build: .
    ports:
      - "4000:4000"
    # env_file:
    #   - ./.env
    depends_on:
      - redis-srv
      - postgres-srv
      - elasticsearch
    networks:
      - app_network

  redis-srv:
    image: redis
    container_name: redis-srv
    ports:
      - 6804:6379
    networks:
      - app_network

  nginx-srv:
    image: nginx
    container_name: nginx-srv
    ports:
      - "81:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
    networks:
      - app_network

  postgres-srv:
    image: postgis/postgis:17-3.4
    container_name: postgres-srv
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    ports:
      - 6805:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - app_network
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak
    command:
      - start-dev
      - --hostname-strict=false
      # - --features=scripts
      # - --import-realm # to import realm from json file (keycloak-realm.json)
      # - --hostname-url=http://localhost:8080
      # - --hostname=localhost
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-srv
      KC_DB_URL_DATABASE: keycloak_db 
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      - postgres-srv
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false # disable security authentication
      # - ELASTIC_PASSWORD=WkgWDzI8pJsoLYb0JbH2      # Set password
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.2 # should be same as elasticsearch version
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # ELASTICSEARCH_USERNAME: elastic
      # ELASTICSEARCH_PASSWORD: WkgWDzI8pJsoLYb0JbH2
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app_network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.2 # should be same as elasticsearch version
    container_name: filebeat
    user: root
    restart: unless-stopped
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/app:ro
      - filebeat-data:/usr/share/filebeat/data
    command: filebeat -e -strict.perms=false
    depends_on:
      - elasticsearch
    networks:
      - app_network

volumes:
  postgres-db:
  esdata:
  filebeat-data:

networks:
  app_network:
    driver: bridge
