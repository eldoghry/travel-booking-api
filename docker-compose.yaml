services:
  node-app:
    container_name: travel-booking-api
    build: .
    ports:
      - "4000:4000"
    # env_file:
    #   - ./.env
    depends_on:
      - redis-srv
      - postgres-srv
      - rabbitmq-srv
    networks:
      - app_network
  redis-srv:
    image: redis
    ports:
      - 6804:6379
    networks:
      - app_network
  nginx-srv:
    image: nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
  postgres-srv:
    image: postgis/postgis:17-3.4
    #restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    ports:
      - 6805:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - app_network
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak
    command:
      - start-dev
      - --hostname-strict=false
      # - --hostname-url=http://localhost:8080
      # - --hostname=localhost
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-srv
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      - postgres-srv
    networks:
      - app_network
  rabbitmq-srv:
    image: rabbitmq:3-management
    container_name: rabbitmq-local1
    hostname: rabbit-local
    ports:
      - "5672:5672"
      - "15672:15672"
    #restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
volumes:
  postgres-db:
  rabbitmq_data:

networks:
  app_network:
    driver: bridge
